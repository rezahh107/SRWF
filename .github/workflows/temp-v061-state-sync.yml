name: Temporary v0.6.1 Runtime State Sync

on:
  push:
    branches:
      - runtime/v061-state-sync-temp
    paths:
      - .github/workflows/temp-v061-state-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build validated runtime-only state commit
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_main=95f00fe2de32b2da756cb29d57f860517228b585
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$expected_main"
          git checkout origin/main -- runtime/CURRENT_STATE.yaml runtime/DECISION_HISTORY.jsonl
          python scripts/temp_v061_state_sync.py
          python scripts/validate_docs.py
          git diff --check
          git rm .github/workflows/temp-v061-state-sync.yml scripts/temp_v061_state_sync.py
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "runtime/CURRENT_STATE.yaml runtime/DECISION_HISTORY.jsonl "
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add runtime/CURRENT_STATE.yaml runtime/DECISION_HISTORY.jsonl
          git commit -m 'runtime: record v0.6.1 FUP preflight pass'
          git push origin HEAD:runtime/v061-state-sync-temp
