name: SRWF v0.6.2 State Indentation Fix

on:
  push:
    branches:
      - fix/v062-current-persiangravity-artifact

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v062-current-persiangravity-artifact
          fetch-depth: 1
      - name: Repair nesting and parse YAML
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('runtime/CURRENT_STATE.yaml')
          lines = p.read_text(encoding='utf-8').splitlines()
          start = next((i for i,l in enumerate(lines) if l == '  v062_full_stack_runtime_qualification:'), None)
          end = next((i for i,l in enumerate(lines) if l == '  project_package:' and start is not None and i > start), None)
          if start is None or end is None or end <= start + 1:
              raise SystemExit('expected v062 qualification block markers not found')
          body = lines[start+1:end]
          if not all(l.startswith('  ') for l in body if l):
              raise SystemExit('unexpected indentation inside v062 qualification block')
          if any(l.startswith('    ') for l in body if l):
              raise SystemExit('block appears already nested; refusing ambiguous rewrite')
          lines[start+1:end] = [('  ' + l) if l else l for l in body]
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          ruby -e "require 'yaml'; s=YAML.load_file('runtime/CURRENT_STATE.yaml'); q=s.fetch('governance').fetch('v062_full_stack_runtime_qualification'); abort unless q['observed_status']=='LAB_PASS' && q['lab_run']==35135801470 && q['staging_exercised']==false && q['ci_ids_authoritative_for_mapping']==false; abort if s.fetch('governance').key?('observed_status')"
          git diff --check
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v062-state-indent-fix.yml
          git add runtime/CURRENT_STATE.yaml
          git diff --cached --check
          git commit -m 'runtime: fix v0.6.2 qualification state nesting'
          git push origin HEAD:fix/v062-current-persiangravity-artifact
