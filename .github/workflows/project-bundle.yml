name: SRWF Project Bundle

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-project-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository integrity
        run: python scripts/validate_docs.py

      - name: Build project package
        run: python scripts/build_project_bundle.py

      - name: Show package checksum
        run: cat dist/SRWF_GPT_Project_Package_v$(cat bundle/VERSION).zip.sha256

      - name: Upload project package
        uses: actions/upload-artifact@v4
        with:
          name: SRWF_GPT_Project_Package_v1.1.0
          path: |
            dist/SRWF_GPT_Project_Package_v1.1.0.zip
            dist/SRWF_GPT_Project_Package_v1.1.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
