name: SRWF CI Runtime Lab

on:
  workflow_dispatch:
    inputs:
      scaffold_url:
        description: Optional Owner-authorized public URL for the exact pinned v0.6.0 Gravity Forms export JSON
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-runtime-lab.yml'
      - 'tests/runtime-lab/**'

permissions:
  contents: read

jobs:
  gf-import-readback:
    name: GF 3.1.1.1 import/read-back
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: srwf-ci-root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -psrwf-ci-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SRWF_WP_PATH: /tmp/srwf-ci-wordpress
      SRWF_ARTIFACT_DIR: /tmp/srwf-ci-artifacts
      SRWF_PACKAGE_DIR: /tmp/srwf-ci-packages
      SRWF_SCAFFOLD_PATH: /tmp/srwf-ci-input/SRWF_GravityForms_Import_v0.6.0_PROVISIONAL.json
      SRWF_REPO_SCAFFOLD_PATH: tests/runtime-lab/fixtures/SRWF_GravityForms_Import_v0.6.0_PROVISIONAL.json
      SRWF_SCAFFOLD_SHA256: 445f146b6c6d9ecf7badecce23b19be9dee59b653ec7c78c4537decaa3b31c89
      SRWF_GF_ZIP: /tmp/srwf-ci-packages/gravityforms-3.1.1.1-owner-supplied-source-package.zip
      SRWF_GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      SRWF_GF_SIZE: '5300290'
      SRWF_GF_VERSION: '3.1.1.1'
      SRWF_WP_VERSION: '6.8.3'
      SRWF_PHP_VERSION: '8.2.33'
      SRWF_WP_CLI: /tmp/wp-cli.phar
      SRWF_WP_CLI_VERSION: '2.12.0'
      SRWF_WP_CLI_SHA256: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
      SRWF_GF_URL: 'https://drive.usercontent.google.com/download?id=10pDROZVyqELKzSzIiJrOyEWKjxS8r22Q&export=download&confirm=t'

    steps:
      - name: Checkout exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert repository and checkout identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'rezahh107/SRWF'
          observed="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$observed" = "$expected"
          mkdir -p "$SRWF_ARTIFACT_DIR" "$SRWF_PACKAGE_DIR" "$(dirname "$SRWF_SCAFFOLD_PATH")"
          printf 'repository=%s expected_sha=%s observed_sha=%s run=%s attempt=%s\n' \
            "$GITHUB_REPOSITORY" "$expected" "$observed" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2.33'
          coverage: none
          extensions: mysqli

      - name: Validate harness syntax and fail-closed assertion guard
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "$SRWF_PHP_VERSION"
          php -l tests/runtime-lab/import-readback.php
          php -l tests/runtime-lab/assert-readback.php
          python3 -m py_compile tests/runtime-lab/write-blocked-evidence.py tests/runtime-lab/render-summary.py
          bash tests/runtime-lab/self-test.sh

      - name: Admit exact scaffold input or record blocker
        id: scaffold
        shell: bash
        env:
          DISPATCH_SCAFFOLD_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.scaffold_url || '' }}
        run: |
          set -Eeuo pipefail
          source_class=''
          source_locator=''
          if [[ -f "$SRWF_REPO_SCAFFOLD_PATH" ]]; then
            cp "$SRWF_REPO_SCAFFOLD_PATH" "$SRWF_SCAFFOLD_PATH"
            source_class='REPOSITORY_MANAGED_EXACT_ARTIFACT'
            source_locator="$SRWF_REPO_SCAFFOLD_PATH"
          elif [[ -n "$DISPATCH_SCAFFOLD_URL" ]]; then
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              "$DISPATCH_SCAFFOLD_URL" --output "$SRWF_SCAFFOLD_PATH"
            source_class='OWNER_AUTHORIZED_PUBLIC_SOURCE'
            source_locator='workflow_dispatch_url_redacted_from_evidence'
          else
            python3 tests/runtime-lab/write-blocked-evidence.py \
              "$SRWF_ARTIFACT_DIR/lab-evidence.json" \
              'EXACT_SCAFFOLD_BYTES_UNAVAILABLE' \
              "$SRWF_SCAFFOLD_SHA256"
            echo 'blocked=true' >> "$GITHUB_OUTPUT"
            echo '### SRWF CI Runtime Lab — LAB_BLOCKED' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Exact v0.6.0 scaffold bytes were not present in the repository and no Owner-authorized dispatch URL was supplied. No substitute scaffold was generated.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s  %s\n' "$SRWF_SCAFFOLD_SHA256" "$SRWF_SCAFFOLD_PATH" | sha256sum -c -
          printf 'SRWF_SCAFFOLD_SOURCE_CLASS=%s\n' "$source_class" >> "$GITHUB_ENV"
          printf 'SRWF_SCAFFOLD_SOURCE_LOCATOR=%s\n' "$source_locator" >> "$GITHUB_ENV"
          echo 'blocked=false' >> "$GITHUB_OUTPUT"

      - name: Install exact WP-CLI and WordPress
        if: steps.scaffold.outputs.blocked != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -L --fail --retry 3 \
            -o "$SRWF_WP_CLI" \
            "https://github.com/wp-cli/wp-cli/releases/download/v${SRWF_WP_CLI_VERSION}/wp-cli-${SRWF_WP_CLI_VERSION}.phar"
          printf '%s  %s\n' "$SRWF_WP_CLI_SHA256" "$SRWF_WP_CLI" | sha256sum -c -
          mkdir -p "$SRWF_WP_PATH"
          php "$SRWF_WP_CLI" core download --path="$SRWF_WP_PATH" --version="$SRWF_WP_VERSION" --force --skip-content
          php "$SRWF_WP_CLI" config create --path="$SRWF_WP_PATH" \
            --dbname=wordpress --dbuser=root --dbpass=srwf-ci-root --dbhost=127.0.0.1:3306 --skip-check
          php "$SRWF_WP_CLI" core install --path="$SRWF_WP_PATH" \
            --url=http://127.0.0.1:8080 --title='SRWF CI Runtime Lab' \
            --admin_user=runtime_admin --admin_password='srwf-ci-disposable-password' \
            --admin_email='runtime@example.invalid' --skip-email
          test "$(php "$SRWF_WP_CLI" core version --path="$SRWF_WP_PATH")" = "$SRWF_WP_VERSION"

      - name: Fetch, verify, and activate authentic Gravity Forms
        if: steps.scaffold.outputs.blocked != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -L --fail --retry 4 -o "$SRWF_GF_ZIP" "$SRWF_GF_URL"
          test "$(stat -c '%s' "$SRWF_GF_ZIP")" = "$SRWF_GF_SIZE"
          printf '%s  %s\n' "$SRWF_GF_SHA256" "$SRWF_GF_ZIP" | sha256sum -c -
          unzip -tq "$SRWF_GF_ZIP" >/dev/null
          unzip -q "$SRWF_GF_ZIP" -d "$SRWF_WP_PATH/wp-content/plugins"
          grep -q '^Version: 3\.1\.1\.1$' "$SRWF_WP_PATH/wp-content/plugins/gravityforms/gravityforms.php"
          php "$SRWF_WP_CLI" plugin activate gravityforms --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" plugin get gravityforms --field=version --path="$SRWF_WP_PATH")" = "$SRWF_GF_VERSION"

      - name: Import exact scaffold and capture runtime read-back
        if: steps.scaffold.outputs.blocked != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval-file tests/runtime-lab/import-readback.php
          test -s "$SRWF_ARTIFACT_DIR/lab-readback.json"

      - name: Assert exact import/read-back contract
        if: steps.scaffold.outputs.blocked != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/runtime-lab/assert-readback.php \
            "$SRWF_SCAFFOLD_PATH" \
            "$SRWF_ARTIFACT_DIR/lab-readback.json" \
            "$SRWF_ARTIFACT_DIR/lab-evidence.json"
          grep -q '"lab_status": "LAB_PASS"' "$SRWF_ARTIFACT_DIR/lab-evidence.json"

      - name: Prove broken read-back assertion is rejected
        if: steps.scaffold.outputs.blocked != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          SRWF_LAB_EXPECT_TITLE_OVERRIDE='__SRWF_DELIBERATELY_WRONG_TITLE__' \
            php tests/runtime-lab/assert-readback.php \
              "$SRWF_SCAFFOLD_PATH" \
              "$SRWF_ARTIFACT_DIR/lab-readback.json" \
              "$SRWF_ARTIFACT_DIR/negative-evidence.json" \
              >"$SRWF_ARTIFACT_DIR/negative-assertion.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo 'Broken read-back assertion was incorrectly accepted.' >&2
            exit 1
          fi
          grep -q '"lab_status": "LAB_FAIL"' "$SRWF_ARTIFACT_DIR/negative-evidence.json"
          echo 'NEGATIVE_ASSERTION_REJECTED'

      - name: Publish concise Lab summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '### SRWF CI Runtime Lab' >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "$SRWF_ARTIFACT_DIR/lab-evidence.json" ]]; then
            python3 tests/runtime-lab/render-summary.py "$SRWF_ARTIFACT_DIR/lab-evidence.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- status: `LAB_FAIL`' >> "$GITHUB_STEP_SUMMARY"
            echo '- evidence: expected machine-readable evidence file was not produced' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload machine-readable Lab evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: srwf-ci-runtime-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/srwf-ci-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Lab outcome
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$SRWF_ARTIFACT_DIR/lab-evidence.json"
          test -s "$evidence"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["lab_status"])' "$evidence")"
          case "$status" in
            LAB_PASS) exit 0 ;;
            LAB_BLOCKED)
              echo 'SRWF Runtime Lab is blocked; see machine-readable evidence.' >&2
              exit 78
              ;;
            *)
              echo "SRWF Runtime Lab failed with status: $status" >&2
              exit 1
              ;;
          esac
