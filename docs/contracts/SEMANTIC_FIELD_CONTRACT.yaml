contract:
  id: SRWF-SFC
  title: SRWF Semantic Field Contract
  version: 1.0.0-repository-baseline
  semantic_status: OWNER_APPROVED_CLOSED_WITH_EXPLICIT_MATERIALIZATION_GAPS
  binding_status: UNBOUND_UNTIL_AUTHORITATIVE_SCAFFOLD
  canonical_authority: docs/authority/MASTER.md + current Owner decisions
  updated_at: 2026-09-07

semantics:
  include_in_form: "Field must exist in authoritative scaffold/form surface. This is independent of value_required."
  value_required: "Value is mandatory for the relevant actor/write path. false means field may be empty."
  field_id: "Always null in Gate A; populated only in Implementation Mapping after scaffold."

