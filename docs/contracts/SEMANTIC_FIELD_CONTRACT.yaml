materialization_gaps:
  - id: GAP-SFC-CHOICE-CATALOG
    state: INCOMPLETE
    gap: exact current controlled choice catalog for education/group/center/registration status is referenced to Crosswalk/source but not yet embedded in this repository contract
    recovery: import accepted current Crosswalk/mapping evidence and bind choice catalog before final scaffold freeze
  - id: GAP-SFC-CHEQUE-MANUAL-FIELDS
    state: INCOMPLETE
    gap: complete manual cheque machine-key inventory is not explicitly enumerated in current active Master; only amount/due-date + seven Sayad fields are directly supported by retrieved current evidence
    recovery: bind exact manual cheque field list from Owner/source before Cheque Form scaffold freeze
  - id: GAP-SFC-RETENTION
    state: BLOCKED_FOR_REAL_PII_ONLY
    gap: photo/report-card/finance/cheque retention/deletion policy remains Owner decision pending
    recovery: close Privacy/Retention Contract before any real PII in staging/UAT/production
