cheque_child_form:
  cardinality: 1..N
  selected_host: Gravity_Perks_Nested_Forms
  host_status: SELECTED_POC_NOT_PROVEN
  fallback_after_bounded_fail: Gravity_Flow_Parent_Child_Forms
  relationship_parallel_state: FORBIDDEN
  public_visibility: false
  officer_visibility: true
  current_release_requiredness: ALL_MANUAL_CHEQUE_FIELDS_OPTIONAL
  current_write_path: MANUAL_OFFICER_EDIT
  scanner_write_path: DEFERRED
  known_manual_fields:
    - contract_id: CHEQUE_AMOUNT
      machine_purpose: cheque_amount
      include_in_form: true
      value_required: false
      gf_field_type: number
      canonical_storage: Rial
      semantic_status: SOURCE_SUPPORTED_MANUAL_FIELD
      binding_status: UNBOUND
    - contract_id: CHEQUE_DUE_DATE
      machine_purpose: cheque_due_date
      include_in_form: true
      value_required: false
      gf_field_type: jalali_date_or_text
      semantic_status: SOURCE_SUPPORTED_MANUAL_FIELD
      binding_status: UNBOUND
  manual_field_inventory_status: INCOMPLETE_ENUMERATION
  manual_field_inventory_gap: "Current active Master states manual cheque fields are optional but does not enumerate every manual cheque machine key. Do not invent additional keys before owner/source binding."

  future_sayad_fields:
    scanner_population_current_release: false
    fields:
      - {contract_id: SAYAD_QR_VERSION, machine_purpose: qr_version, include_in_form: true, value_required: false, public_visibility: hidden, officer_visibility: hidden_future_reserved, binding_status: UNBOUND}
      - {contract_id: SAYAD_OWNER_TYPE, machine_purpose: owner_type, include_in_form: true, value_required: false, public_visibility: hidden, officer_visibility: hidden_future_reserved, binding_status: UNBOUND}
      - {contract_id: SAYAD_OWNER_IDENTIFIER, machine_purpose: owner_identifier, include_in_form: true, value_required: false, public_visibility: hidden, officer_visibility: hidden_future_reserved, binding_status: UNBOUND}
      - {contract_id: SAYAD_IBAN, machine_purpose: iban, include_in_form: true, value_required: false, public_visibility: hidden, officer_visibility: hidden_future_reserved, binding_status: UNBOUND}
      - {contract_id: SAYAD_BANK_BRANCH, machine_purpose: bank_branch, include_in_form: true, value_required: false, public_visibility: hidden, officer_visibility: hidden_future_reserved, binding_status: UNBOUND}
      - {contract_id: SAYAD_CHEQUE_SERIAL, machine_purpose: cheque_serial, include_in_form: true, value_required: false, public_visibility: hidden, officer_visibility: hidden_future_reserved, binding_status: UNBOUND}
      - {contract_id: SAYAD_ID, machine_purpose: sayad_id, include_in_form: true, value_required: false, public_visibility: hidden, officer_visibility: hidden_future_reserved, binding_status: UNBOUND}
    decision_refs: [OWNER-20260907-DEFER-SCANNER-HIDE-SAYAD-FIELDS, OWNER-20260906-SAYAD-V01-ATOMIC-SEVEN-OUTPUT]

