repository:
  owner: rezahh107
  name: SRWF
  canonical_platform: GitHub
  default_branch: main
  phase: ACTIVE_PROJECT_SSOT
  visibility: private

acceptance:
  accepted_current_ref: main
  feature_branch_is_authority: false
  baseline_status: ACCEPTED_CURRENT
  baseline_acceptance_commit: 01e20f7d56a60c66da11584971590f5872c56c19
  acceptance_basis: MERGED_TO_MAIN_AND_READ_BACK

runtime_state:
  provider: GitHub
  role: LIVE_OPERATIONAL_STATE_SSOT
  repository: rezahh107/SRWF
  branch: main
  current_state: runtime/CURRENT_STATE.yaml
  decision_history: runtime/DECISION_HISTORY.jsonl
  current_state_schema: runtime/schemas/current-state.schema.json
  decision_event_schema: runtime/schemas/decision-event.schema.json
