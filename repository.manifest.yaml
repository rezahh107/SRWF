  semantic_field_contract_human: docs/contracts/SEMANTIC_FIELD_CONTRACT.md
  workflow_contract: docs/contracts/WORKFLOW_CONTRACT.md
  access_control_contract: docs/contracts/ACCESS_CONTROL_CONTRACT.md
  implementation_mapping_machine: docs/contracts/IMPLEMENTATION_MAPPING.yaml
  implementation_mapping_human: docs/contracts/IMPLEMENTATION_MAPPING.md
