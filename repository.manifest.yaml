    name: SRWF_RUNTIME_STATE
    provider: Google Sheets
    status_after_cutover: DEPRECATED_READ_ONLY_MIGRATION_SOURCE
    migration_manifest: history/pre-runtime-ssot/MIGRATION_MANIFEST.json
    decision_index: history/pre-runtime-ssot/DECISION_HISTORY_INDEX.json

architecture:
  parent: WordPress + Gravity Forms + Gravity Flow
  canonical_data_authority: Gravity Forms
  workflow_authority: Gravity Flow
  officer_operational_surface: Gravity Flow
  gravityview_role: OPTIONAL_PRESENTATION_ONLY_AFTER_PROVEN_GAP
